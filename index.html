<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>こどもタッチひろば</title>
<meta name="theme-color" content="#3B82E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タッチひろば">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen toy box — age switch, three big game tiles per age; each game fills the screen with oversized tap targets; grown-up settings behind a long-press */
:root {
  --bg: #F3F6FB;
  --card: #FFFFFF;
  --ink: #2A3142;
  --ink-soft: #6B7488;
  --sun: #FFB627;
  --leaf: #2FAE6A;
  --sky: #3B82E0;
  --berry: #E5484D;
  --grape: #8A5CD6;
  --orange: #F7862F;
  --line: #DCE3EE;
  --pond: #DDEEFF;
  --night: #2E3A66;
  --font-display: "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  touch-action: manipulation;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  max-width: 720px;
  margin: 0 auto;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 14px; }
button { font-family: inherit; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.back {
  width: 56px; height: 56px; border-radius: 50%;
  border: 3px solid var(--line); background: var(--card); color: var(--ink);
  font-size: 26px; cursor: pointer; display: grid; place-items: center; flex: none;
}
.bar h2 { margin: 0; font-size: 22px; font-weight: 900; }
.stars { margin-left: auto; font-size: 20px; color: var(--sun); letter-spacing: 2px; min-height: 1em; font-variant-numeric: tabular-nums; }

/* home */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.home-title { margin: 0; white-space: nowrap; font-size: clamp(20px, 5.6vw, 30px); font-weight: 900; line-height: 1.2; }
.home-title span { color: var(--berry); }
.gear {
  position: relative; display: flex; align-items: center; gap: 6px; flex: none;
  border: 2px solid var(--line); background: var(--card); color: var(--ink-soft);
  font-size: 13px; font-weight: 700; border-radius: 999px; padding: 8px 14px; cursor: pointer;
  overflow: hidden; min-height: 40px;
}
.gear .fill { position: absolute; inset: 0; background: var(--sun); opacity: .35; transform: scaleX(0); transform-origin: left; }
.gear.holding .fill { transform: scaleX(1); transition: transform .9s linear; }
.gear span { position: relative; }
.ages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 5px; }
.age {
  border: none; background: transparent; color: var(--ink-soft); border-radius: 999px;
  font-size: clamp(17px, 5vw, 24px); font-weight: 900; min-height: 54px; cursor: pointer; white-space: nowrap; padding: 0 4px;
}
.age[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tiles { flex: 1; display: grid; grid-template-rows: repeat(3, 1fr); gap: 12px; min-height: 0; }
.tile {
  border: none; border-radius: 28px; cursor: pointer; color: #fff;
  display: flex; align-items: center; gap: 16px; padding: 10px 20px; text-align: left;
  box-shadow: 0 7px 0 rgba(0,0,0,.14); transition: transform .12s; min-height: 0;
}
.tile:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
.tile .pic { width: clamp(64px, 20vw, 96px); height: clamp(64px, 20vw, 96px); flex: none; display: grid; place-items: center; font-size: clamp(50px, 15vw, 76px); line-height: 1; }
.tile .pic svg { width: 100%; height: 100%; }
.tile .t { font-size: clamp(22px, 6.4vw, 32px); font-weight: 900; line-height: 1.2; }
.tile .sub { display: block; font-size: 14px; font-weight: 700; opacity: .92; margin-top: 2px; }
.tile.leaf { background: var(--leaf); }
.tile.sky { background: var(--sky); }
.tile.sun { background: var(--sun); color: var(--ink); }
.tile.berry { background: var(--berry); }
.tile.grape { background: var(--grape); }
.tile.orange { background: var(--orange); }
.tile.night { background: var(--night); }
.peek {
  flex: 1; min-height: 0; border: 3px solid var(--line); border-radius: 32px; background: var(--card); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--ink);
  transition: background-color .3s;
}
.peek-face { font-size: clamp(120px, 40vw, 220px); line-height: 1.05; }
.peek-face.boo { animation: boo .6s cubic-bezier(.3, 1.6, .5, 1); }
.peek-face.hide { animation: hidein .35s ease-out; }
@keyframes boo { 0% { transform: scale(.3) rotate(-10deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes hidein { 0% { transform: scale(.85); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
.peek-word { font-size: clamp(30px, 9vw, 46px); font-weight: 900; color: var(--berry); min-height: 1.3em; }
.peek-word.wait { color: var(--ink-soft); }
.sky-area { flex: 1; min-height: 0; position: relative; border-radius: 28px; overflow: hidden; background: #0E1430; touch-action: none; border: 3px solid var(--line); }
.sky-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sky-hint { position: absolute; left: 0; right: 0; top: 45%; margin: 0; text-align: center; color: #8E9AC4; font-size: 22px; pointer-events: none; transition: opacity .5s; }

/* ねんねの音 (night palette while this screen is open) */
body.night {
  --bg: #121830; --card: #1C2440; --ink: #E6EAF6; --ink-soft: #9BA6C6; --line: #2C3658; --sun: #F4C76A;
}
.nn-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.nn {
  border: 3px solid var(--line); background: var(--card); color: var(--ink); border-radius: 22px; cursor: pointer;
  min-height: 76px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left;
}
.nn .ic { font-size: 30px; line-height: 1; flex: none; }
.nn b { display: block; font-size: 17px; font-weight: 900; }
.nn small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.nn[aria-pressed="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 14%, var(--card)); }
.nn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nn-row .lbl { font-size: 14px; color: var(--ink-soft); min-width: 3.5em; }
.nn-seg { display: flex; gap: 6px; flex-wrap: wrap; }
.nn-seg button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-size: 15px; font-weight: 700; cursor: pointer; }
.nn-seg button[aria-pressed="true"] { background: var(--sun); color: #1C2440; border-color: var(--sun); }
.nn-play { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.nn-main {
  border: none; border-radius: 999px; min-height: 72px; font-size: 24px; font-weight: 900; cursor: pointer;
  background: var(--sun); color: #1C2440; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.nn-main.on { background: var(--card); color: var(--ink); border: 3px solid var(--sun); }
.nn-status { text-align: center; font-size: 15px; color: var(--ink-soft); min-height: 1.4em; font-variant-numeric: tabular-nums; }
.nn-dark { border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; min-height: 48px; font-size: 15px; font-weight: 700; cursor: pointer; }
.nn-note { font-size: 12px; color: var(--ink-soft); margin: 0; font-weight: 500; line-height: 1.6; }
.blackout { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); touch-action: none; }
.blackout span { color: #3a3a3a; font-size: 13px; font-weight: 500; user-select: none; }
.blackout .ring { position: absolute; inset: auto 0 0 0; height: 4px; background: #333; transform: scaleX(0); transform-origin: left; }
.blackout.holding .ring { transform: scaleX(1); transition: transform 2s linear; }
.sil-white { filter: brightness(0) invert(1); }
.parent-note { text-align: center; font-size: 12px; color: var(--ink-soft); font-weight: 500; margin: 0; }

/* animals */
.zoo { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: center; min-height: 0; }
.ani {
  aspect-ratio: 1; max-width: 100%;
  border: 3px solid var(--line); border-radius: 28px; background: var(--card);
  font-size: clamp(44px, 13vw, 76px); cursor: pointer; padding: 0;
  display: grid; place-items: center; line-height: 1;
}
.zoo.few .ani { font-size: clamp(60px, 18vw, 100px); }
.zoo.many { grid-template-columns: repeat(4, 1fr); gap: 10px; }
.zoo.many .ani { font-size: clamp(36px, 10.5vw, 66px); border-radius: 22px; }
.ani span { display: block; line-height: 1; }
.crow { filter: brightness(.28) saturate(0); }
.sparrow { filter: sepia(.9) saturate(1.6) hue-rotate(-10deg) brightness(.85); }
.ani.pop { animation: pop .5s ease; border-color: var(--sun); }
@keyframes pop { 0%{transform:scale(1)} 30%{transform:scale(1.18) rotate(-6deg)} 60%{transform:scale(.95) rotate(4deg)} 100%{transform:scale(1)} }
.bubble {
  min-height: 92px; border-radius: 24px; background: var(--card); border: 3px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.bubble .name { font-size: 30px; font-weight: 900; }
.bubble .cry { font-size: 20px; color: var(--berry); }
.bubble .hint { font-size: 18px; color: var(--ink-soft); font-weight: 500; }

/* bubbles game */
.pond { flex: 1; position: relative; overflow: hidden; border-radius: 28px; background: var(--pond); border: 3px solid var(--line); min-height: 0; touch-action: none; }
.pond-hint { position: absolute; left: 0; right: 0; top: 40%; text-align: center; margin: 0; font-size: 20px; color: var(--ink-soft); pointer-events: none; transition: opacity .4s; }
.bub { position: absolute; padding: 0; border: none; background: none; cursor: pointer; animation: rise var(--dur) linear forwards; }
.bub .in {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 9%, transparent 10%), radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 25%, transparent) 0 58%, color-mix(in srgb, var(--c) 70%, transparent) 72%, var(--c) 100%);
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--c) 80%, white);
  animation: wobble 1.8s ease-in-out infinite alternate;
}
.bub.popped { pointer-events: none; }
.bub.popped .in { animation: burst .32s ease-out forwards; }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(calc(-1 * var(--rise))); } }
@keyframes wobble { from { transform: translateX(-8px) scale(1, .96); } to { transform: translateX(8px) scale(.96, 1); } }
@keyframes burst { to { transform: scale(1.7); opacity: 0; } }
.splash { position: absolute; pointer-events: none; font-size: 26px; font-weight: 900; color: var(--ink); transform: translate(-50%, -50%); animation: splash .8s ease-out forwards; }
@keyframes splash { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } to { opacity: 0; transform: translate(-50%, -120%) scale(1.2); } }

/* quiz common */
.ask {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--card); border: 3px solid var(--line); border-radius: 24px; min-height: 92px; padding: 8px 12px;
}
.ask .q { font-size: clamp(26px, 7.5vw, 40px); font-weight: 900; text-align: center; text-wrap: balance; }
.ask .q b { padding: 0 2px; }
.speak {
  width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--sun); color: var(--ink);
  font-size: 24px; cursor: pointer; flex: none;
}
.choices { flex: 1; display: grid; gap: 12px; align-content: center; justify-content: center; min-height: 0; }
.choices.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 460px; width: 100%; margin: 0 auto; }
@media (max-width: 480px) {
  .choices.n3 { grid-template-columns: 1fr 1fr; }
  .choices.n3 .opt:nth-child(3) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 6px); }
}
.opt {
  aspect-ratio: 1; max-width: 100%; border: 3px solid var(--line); border-radius: 28px; background: var(--card);
  cursor: pointer; padding: 14%; display: grid; place-items: center; color: var(--ink);
}
.opt svg { width: 100%; height: 100%; overflow: visible; }
.choices.flat { grid-template-columns: repeat(var(--k), minmax(0, 1fr)); max-width: none; }
.choices.flat .opt { grid-column: auto; width: auto; justify-self: stretch; }
.opt.emo { padding: 0; overflow: hidden; font-size: clamp(48px, 13vw, 84px); line-height: 1; }
.opt.shake { animation: shake .45s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
.opt.right { border-color: var(--berry); transform: scale(1.06); transition: transform .2s; }
.opt.dim { opacity: .35; }

/* counting */
.tray {
  flex: 1.2; min-height: 0; background: var(--card); border: 3px solid var(--line); border-radius: 28px;
  display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 6px 10px; padding: 12px;
}
.thing { position: relative; border: none; background: none; padding: 4px; cursor: pointer; line-height: 1; font-size: var(--ts, 60px); border-radius: 20px; }
.thing.counted { background: #FFF4D6; }
.thing.counted::after {
  content: attr(data-n); position: absolute; right: -4px; top: -6px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--berry); color: #fff;
  font-size: 18px; font-weight: 900; display: grid; place-items: center; line-height: 30px;
}
.thing.flash { animation: pop .5s ease; }
.nums { display: grid; gap: 12px; }
.nums.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.nums.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nums.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.num {
  border: 3px solid var(--line); background: var(--card); border-radius: 24px; cursor: pointer; color: var(--ink);
  min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.num b { font-size: clamp(44px, 13vw, 60px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.num small { font-size: 15px; color: var(--ink-soft); font-weight: 700; }
.num.shake { animation: shake .45s; }
.num.right { border-color: var(--berry); }
.num.dim { opacity: .35; }

/* shadow */
.shadow-box {
  flex: 1; min-height: 0; background: var(--card); border: 3px solid var(--line); border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; padding: 8px;
}
.sil { font-size: clamp(100px, 30vw, 170px); line-height: 1.05; filter: brightness(0); opacity: .82; transition: filter .5s, opacity .5s; }
.sil.reveal { filter: none; opacity: 1; }
.shadow-q { font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin: 0; text-align: center; }
.shadow-box .speak { position: absolute; right: 10px; top: 10px; }

/* settings (for grown-ups) */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 700; border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.settings { overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; font-weight: 500; }
.sec { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sec h3 { margin: 0; font-size: 17px; font-weight: 900; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row > .lbl { font-size: 14px; font-weight: 700; }
.help { font-size: 12px; color: var(--ink-soft); margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button, .chip {
  border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 700;
  border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg button.chip[aria-pressed="true"] { background: var(--card); color: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip[aria-pressed="false"] { opacity: .45; }
.chip .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.chip svg { width: 20px; height: 20px; }
.preset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.preset button {
  border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px;
  padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.preset button b { font-size: 15px; font-weight: 900; white-space: nowrap; }
.preset button small { font-size: 11px; color: var(--ink-soft); font-weight: 500; }
.preset button[aria-pressed="true"] { border-color: var(--berry); background: #FFF1F1; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; }
.switch button { width: 60px; height: 34px; border-radius: 999px; border: none; background: var(--line); position: relative; cursor: pointer; flex: none; }
.switch button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch button[aria-checked="true"] { background: var(--leaf); }
.switch button[aria-checked="true"]::after { left: 30px; }
.voice-row { display: flex; gap: 8px; flex-wrap: wrap; }
.voice-row select { flex: 1 1 200px; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; padding: 6px 10px; }
.try { border: 2px solid var(--line); background: var(--sun); color: var(--ink); font-size: 15px; font-weight: 700; border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 44px; }
.reset { align-self: flex-start; border: 2px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 14px; border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 44px; }

/* hanamaru overlay */
.maru { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
.maru svg { width: min(78vw, 420px); height: auto; }
.maru path { fill: none; stroke: var(--berry); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.maru .txt { font-family: var(--font-display); font-weight: 900; font-size: 34px; fill: var(--berry); }
.maru.go path { animation: draw 1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  .ani.pop, .opt.shake, .num.shake, .thing.flash { animation: none; }
  .bub .in { animation: none; }
  .peek-face.boo, .peek-face.hide { animation: none; }
  .maru.go path { animation-duration: .01s; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function () {
  const app = document.getElementById('app');

  /* ---------- data ---------- */
  // [絵, なまえ, なきごえ(ことば), 音声ファイル, 見た目の調整]
  const ANIMALS = [
    ['🐶', 'いぬ', 'ワンワン', 'inu'], ['🐱', 'ねこ', 'ニャーオ', 'neko'], ['🐷', 'ぶた', 'ブーブー', 'buta'],
    ['🐮', 'うし', 'モーモー', 'ushi'], ['🐤', 'ひよこ', 'ピヨピヨ', 'hiyoko'], ['🐘', 'ぞう', 'パオーン', 'zou'],
    ['🦁', 'らいおん', 'ガオー', 'lion'], ['🐑', 'ひつじ', 'メェー', 'hitsuji'], ['🐴', 'うま', 'ヒヒーン', 'uma'],
    ['🐓', 'にわとり', 'コケコッコー', 'niwatori'], ['🐐', 'やぎ', 'メェェー', 'yagi'], ['🐦', 'からす', 'カーカー', 'karasu', 'crow'],

      <div class="choices" id="choices"></div>

    wireBack();

    function makeQuestion() {
      const cols = COLORS.filter(c => Q.colors.includes(c.name));
      const types = Q.quizType === 'mix' ? ['color', 'shape'] : [Q.quizType];
      if (Q.combo && Q.quizType === 'mix') types.push('combo');
      const type = types[rand(types.length)];

      if (type === 'combo') {
        const n = Math.min(Q.choices, cols.length * Q.shapes.length);
        const tc = cols[rand(cols.length)], ts = Q.shapes[rand(Q.shapes.length)];
        const opts = [{ c: tc, s: ts, ok: true }];
        const key = o => o.c.name + o.s;
        const used = new Set([key(opts[0])]);
        const sameColor = shuffle(Q.shapes.filter(s => s !== ts))[0];
        const sameShape = shuffle(cols.filter(c => c !== tc))[0];
        [sameColor && { c: tc, s: sameColor }, sameShape && { c: sameShape, s: ts }].forEach(o => {
          if (o && opts.length < n && !used.has(key(o))) { opts.push(o); used.add(key(o)); }
        });
        let guard = 0;
        while (opts.length < n && guard++ < 200) {
          const o = { c: cols[rand(cols.length)], s: Q.shapes[rand(Q.shapes.length)] };
          if (!used.has(key(o))) { opts.push(o); used.add(key(o)); }
        }
        return {
          label: `<b style="color:${tc.hex}">${tc.adj}</b><b>${ts}</b>は どれ？`,
          voice: `${Y(tc.adj)}${Y(ts)}は、どれかな？`, target: `${Y(tc.adj)}${Y(ts)}`,
          opts: shuffle(opts).map(o => ({ svg: shapeSVG(o.s, o.c.hex), ok: !!o.ok, name: `${o.c.adj}${o.s}` }))
        };
      }

        };
      }
      const n = Math.min(Q.choices, Q.shapes.length);
      const shs = shuffle(Q.shapes).slice(0, n);
      const pc = shuffle(cols);

      return {
        label: `<b>${shs[ans]}</b>は どれ？`,
        voice: `${Y(shs[ans])}は、どれかな？`, target: Y(shs[ans]),
        opts: shs.map((s, i) => ({ svg: shapeSVG(s, pc[i % pc.length].hex), ok: i === ans, name: s }))

      box.querySelectorAll('.opt').forEach(btn => { btn.onclick = () => answer(btn, current.opts[+btn.dataset.i]); });
      later(() => say(current.voice), first ? 150 : 300);

  /* ---------- 0・1さい: キラキラタッチ ---------- */
  function sparkle() {
    document.body.classList.add('night');
    app.innerHTML = `<div class="screen">${bar('キラキラタッチ')}
      <div class="sky-area" id="sky"><canvas id="cv"></canvas><p class="sky-hint" id="sh">どこでも さわってね</p></div>
    </div>`;
    wireBack();
    const sky = document.getElementById('sky'), cv = document.getElementById('cv'), ctx2 = cv.getContext('2d');
    const hint = document.getElementById('sh');
    const PAL = ['#FFD45E', '#FF8FB8', '#7FD3FF', '#9CF59B', '#C9A6FF', '#FFFFFF', '#FFB36B'];
    const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
    let W = 0, H = 0, dpr = 1, raf = 0, parts = [], lastNote = 0;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = sky.clientWidth; H = sky.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx2.fillStyle = '#0E1430'; ctx2.fillRect(0, 0, W, H);
    }
    size();
    const ro = new ResizeObserver(size); ro.observe(sky);
    function chime(x) {
      const now = performance.now();
      if (now - lastNote < 110) return;
      lastNote = now;
      const f = NOTES[Math.max(0, Math.min(NOTES.length - 1, Math.floor(x / W * NOTES.length)))];
      tone(f, 0, .9, 'sine', .1); tone(f * 2, 0, .5, 'sine', .03);
    }
    function burst(x, y, n, speed) {
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * speed;
        parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - .4, life: 0, max: 50 + Math.random() * 40,
          size: 5 + Math.random() * 10, color: PAL[rand(PAL.length)], star: Math.random() < .55, rot: Math.random() * 6 });
      }
    }
    function ring(x, y) { parts.push({ ring: true, x, y, life: 0, max: 40, size: 10, color: PAL[rand(PAL.length)] }); }
    function star(x, y, r, rot) {
      ctx2.beginPath();
      for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = rot + i * Math.PI / 5; ctx2.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
      ctx2.closePath(); ctx2.fill();
    }
    function frame() {
      ctx2.globalCompositeOperation = 'source-over';
      ctx2.fillStyle = 'rgba(14,20,48,0.22)'; ctx2.fillRect(0, 0, W, H);
      ctx2.globalCompositeOperation = 'lighter';
      parts = parts.filter(p => p.life < p.max);
      for (const p of parts) {
        p.life++;
        const k = 1 - p.life / p.max;
        if (p.ring) {
          ctx2.strokeStyle = p.color; ctx2.globalAlpha = k * .8; ctx2.lineWidth = 3;
          ctx2.beginPath(); ctx2.arc(p.x, p.y, p.size + p.life * 2.2, 0, Math.PI * 2); ctx2.stroke();
          continue;
        }
        p.x += p.vx; p.y += p.vy; p.vy += .03; p.vx *= .985; p.rot += .05;
        ctx2.globalAlpha = Math.max(0, k);
        ctx2.fillStyle = p.color;
        if (p.star) star(p.x, p.y, p.size * (.6 + .4 * k), p.rot);
        else { ctx2.beginPath(); ctx2.arc(p.x, p.y, p.size * .45 * (.5 + .5 * k), 0, Math.PI * 2); ctx2.fill(); }
      }
      ctx2.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    const pos = e => { const r = sky.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const down = new Set();
    sky.addEventListener('pointerdown', e => {
      e.preventDefault(); audio(); down.add(e.pointerId);
      try { sky.setPointerCapture(e.pointerId); } catch (er) {}
      const [x, y] = pos(e); burst(x, y, 16, 3.2); ring(x, y); lastNote = 0; chime(x);
      hint.style.opacity = 0;
    });
    sky.addEventListener('pointermove', e => {
      if (!down.has(e.pointerId)) return;
      const [x, y] = pos(e); burst(x, y, 3, 1.6); chime(x);
    });
    ['pointerup', 'pointercancel'].forEach(ev => sky.addEventListener(ev, e => down.delete(e.pointerId)));
    sky.addEventListener('contextmenu', e => e.preventDefault());
    cleanup = () => { cancelAnimationFrame(raf); ro.disconnect(); document.body.classList.remove('night'); };
  }

  /* ---------- 0・1さい: ねんねの音 ---------- */
  const NSR = 22050;
  function genNoise(type, level) {
    const def = NOISES.find(n => n.id === type);
    const N = NSR * def.sec, XF = Math.floor(NSR * 0.4), T = N + XF;
    const a = new Float32Array(T);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, br = 0, hp = 0, xp = 0, lp = 0, lp2 = 0;
    const pink = w => { b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852; b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898; const o = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362; b6 = w * .115926; return o * .11; };
    const brown = w => { br = (br + .02 * w) / 1.02; return br * 3.5; };
    const kH = Math.exp(-2 * Math.PI * 1500 / NSR), kL = 1 - Math.exp(-2 * Math.PI * 4500 / NSR), kLow = 1 - Math.exp(-2 * Math.PI * 700 / NSR);
    for (let i = 0; i < T; i++) {
      const t = i / NSR, w = Math.random() * 2 - 1;
      let v = 0;
      if (type === 'white') v = w * .5;
      else if (type === 'pink') v = pink(w);
      else if (type === 'brown') v = brown(w);
      else if (type === 'shush') {
        hp = kH * (hp + w - xp); xp = w; lp += kL * (hp - lp);
        const ph = t % 1.6;
        const env = ph < .18 ? ph / .18 : ph < 1.05 ? 1 : ph < 1.45 ? 1 - (ph - 1.05) / .4 : 0;
        v = lp * env * env * 1.6;
      } else if (type === 'womb') {
        lp2 += kLow * (brown(w) - lp2);
        const ph = t % .8;
        const beat = (x, f, d, g) => x >= 0 ? (Math.sin(2 * Math.PI * f * x) + .6 * Math.sin(2 * Math.PI * f * 2 * x) + .3 * Math.sin(2 * Math.PI * f * 3 * x)) * Math.exp(-x / d) * g : 0;
        v = lp2 * .9 + beat(ph, 62, .07, .9) + beat(ph - .27, 52, .06, .55);
      } else if (type === 'waves') {
        const m = .5 - .5 * Math.cos(2 * Math.PI * t / 8);
        v = pink(w) * (.12 + .88 * Math.pow(m, 1.6));
      }
      a[i] = v;
    }
    // seamless loop: crossfade the tail into the head
    for (let i = 0; i < XF; i++) { const x = i / XF; a[i] = a[i] * Math.sqrt(x) + a[N + i] * Math.sqrt(1 - x); }
    const out = a.subarray(0, N);
    let ss = 0, pk = 0;
    for (let i = 0; i < N; i++) { ss += out[i] * out[i]; pk = Math.max(pk, Math.abs(out[i])); }
    const rms = Math.sqrt(ss / N) || 1;
    const target = ({ low: .05, mid: .1, high: .17 }[level] || .05) * (def.boost || 1);
    const g = target / rms;
    for (let i = 0; i < N; i++) out[i] = Math.tanh(out[i] * g);
    // 継ぎ目のない短い音を約4分ぶんつなげる（スマホのループ再生で入る一瞬の無音を、4分に1回まで減らす）
    const reps = Math.max(1, Math.round(240 / def.sec));
    const long = new Float32Array(N * reps);
    for (let r = 0; r < reps; r++) long.set(out, r * N);
    return long;
  }
  function toWav(f) {
    const buf = new ArrayBuffer(44 + f.length * 2), v = new DataView(buf);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + f.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, NSR, true);
    v.setUint32(28, NSR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, f.length * 2, true);
    for (let i = 0; i < f.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, f[i])) * 32767, true);
    return buf;
  }

  let nAudio = null, nSrc = null, nGain = null, nUrl = null, nEnd = 0, nTick = null, nLock = null;
  function noiseStop() {
    try { if (nAudio) { nAudio.pause(); nAudio.src = ''; } } catch (e) {}
    try { if (nSrc) nSrc.stop(); } catch (e) {}
    if (nUrl) URL.revokeObjectURL(nUrl);
    nAudio = nSrc = nGain = nUrl = null; nEnd = 0;
    clearInterval(nTick); nTick = null;
    try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
  }
  async function noiseStart() {
    noiseStop();
    const def = NOISES.find(n => n.id === S.noiseType);
    const f = genNoise(S.noiseType, S.noiseVol);
    let ok = false;
    try {
      nUrl = URL.createObjectURL(new Blob([toWav(f)], { type: 'audio/wav' }));
      const a = new Audio(); a.loop = true; a.setAttribute('playsinline', ''); a.src = nUrl;
      await a.play(); nAudio = a; ok = true;
    } catch (e) { if (nUrl) URL.revokeObjectURL(nUrl); nUrl = null; }
    if (!ok) {
      const c = audio(); if (!c) return false;
      const b = c.createBuffer(1, f.length, NSR); b.copyToChannel(f, 0);
      nSrc = c.createBufferSource(); nSrc.buffer = b; nSrc.loop = true;
      nGain = c.createGain(); nGain.gain.value = 1; nSrc.connect(nGain).connect(c.destination); nSrc.start();
    }
    nEnd = S.noiseTimer ? Date.now() + S.noiseTimer * 60000 : 0;
    try {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'ねんねの音：' + def.t, artist: 'こどもタッチひろば' });
        navigator.mediaSession.playbackState = 'playing';
        navigator.mediaSession.setActionHandler('pause', () => { noiseStop(); if (nUI) nUI(); });
        navigator.mediaSession.setActionHandler('play', () => { noiseStart().then(() => nUI && nUI()); });
      }
    } catch (e) {}
    nTick = setInterval(() => { if (nEnd && Date.now() >= nEnd) noiseFadeOut(); if (nUI) nUI(); }, 1000);
    return true;
  }
  function noiseFadeOut() {
    nEnd = 0;
    const steps = 20; let k = 0;
    const iv = setInterval(() => {
      k++;
      const v = Math.max(0, 1 - k / steps);
      try { if (nAudio) nAudio.volume = v; if (nGain) nGain.gain.value = v; } catch (e) {}
      if (k >= steps) { clearInterval(iv); noiseStop(); if (nUI) nUI(); }
    }, 500);
  }
  const playing = () => !!(nAudio || nSrc);
  let nUI = null;

  function nenne() {
    document.body.classList.add('night');
    const seg = (key, items) => `<div class="nn-seg" data-key="${key}">${items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(S[key]) === String(v)}">${l}</button>`).join('')}</div>`;
    app.innerHTML = `<div class="screen">${bar('ねんねの音')}
      <div class="nn-grid">${NOISES.map(n => `<button class="nn" data-n="${n.id}" aria-pressed="${S.noiseType === n.id}"><span class="ic">${n.ic}</span><span><b>${n.t}</b><small>${n.sub}</small></span></button>`).join('')}</div>
      <div class="nn-row"><span class="lbl">音量</span>${seg('noiseVol', [['low', '小さめ'], ['mid', 'ふつう'], ['high', '大きめ']])}</div>
      <div class="nn-row"><span class="lbl">タイマー</span>${seg('noiseTimer', [[15, '15分'], [30, '30分'], [60, '60分'], [0, 'ずっと']])}</div>
      <div class="nn-play">
        <button class="nn-main" id="nn-main"></button>
        <div class="nn-status" id="nn-status" aria-live="polite"></div>
        <button class="nn-dark" id="nn-dark">画面を真っ暗にする（長押しでもどる）</button>
        <p class="nn-note">スマホは赤ちゃんの顔から離して置き、音量は小さめで使ってください。タイマーが終わると、ゆっくり小さくなって止まります。</p>
      </div>
    </div>`;
    const main = document.getElementById('nn-main'), st = document.getElementById('nn-status');
    nUI = () => {
      if (!document.getElementById('nn-main')) return;
      const on = playing();
      main.classList.toggle('on', on);
      main.innerHTML = on ? '■ とめる' : '▶ ならす';
      if (!on) { st.textContent = ''; return; }
      if (nEnd) { const r = Math.max(0, Math.ceil((nEnd - Date.now()) / 1000)); st.textContent = `あと ${Math.floor(r / 60)}分${String(r % 60).padStart(2, '0')}秒で止まります`; }
      else st.textContent = '止めるまで鳴り続けます';
    };
    nUI();
    main.onclick = async () => { if (playing()) noiseStop(); else { audio(); await noiseStart(); } nUI(); };
    app.querySelectorAll('.nn').forEach(b => b.onclick = async () => {
      S.noiseType = b.dataset.n; save();
      app.querySelectorAll('.nn').forEach(x => x.setAttribute('aria-pressed', x === b));
      audio(); await noiseStart(); nUI();
    });
    app.querySelectorAll('.nn-seg').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = async () => {
      const key = g.dataset.key;
      S[key] = key === 'noiseTimer' ? +b.dataset.v : b.dataset.v; save();
      g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (key === 'noiseVol' && playing()) await noiseStart();
      if (key === 'noiseTimer' && playing()) nEnd = S.noiseTimer ? Date.now() + S.noiseTimer * 60000 : 0;
      nUI();
    }));
    document.getElementById('nn-dark').onclick = blackout;
    document.getElementById('back').onclick = () => go(home);
    cleanup = () => { noiseStop(); nUI = null; document.body.classList.remove('night'); document.querySelectorAll('.blackout').forEach(x => x.remove()); releaseLock(); };
  }
  async function blackout() {
    const el = document.createElement('div');
    el.className = 'blackout';
    el.innerHTML = '<span>2秒長押しでもどる</span><i class="ring"></i>';
    document.body.appendChild(el);
    try { if ('wakeLock' in navigator) nLock = await navigator.wakeLock.request('screen'); } catch (e) { nLock = null; }
    let t = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('holding'); t = setTimeout(() => { el.remove(); releaseLock(); }, 2000); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, () => { el.classList.remove('holding'); clearTimeout(t); }));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  function releaseLock() { try { if (nLock) nLock.release(); } catch (e) {} nLock = null; }

  /* ---------- settings screen ---------- */
  let tab = null;
  function seg(path, items) {
    const cur = String(getP(path));
    return `<div class="seg" data-path="${path}">${items.map(([v, l]) => `<button data-v="${v}" data-num="${typeof v === 'number'}" aria-pressed="${cur === String(v)}">${l}</button>`).join('')}</div>`;
  }
  function sw(path, label) {
    const id = 'lbl-' + path.replace('.', '-');
    return `<div class="switch"><span id="${id}">${label}</span><button role="switch" data-path="${path}" aria-labelledby="${id}" aria-checked="${!!getP(path)}"></button></div>`;
  }
  function quizSection(age) {
    const q = 'q' + age, Q = S[q], lv = detectLevel(Q);
    return `<section class="sec">
      <h3>いろ・かたち（${age}さい用）</h3>
      <div class="row">
        <span class="lbl">むずかしさ</span>
        <div class="preset">
          <button data-q="${q}" data-p="easy" aria-pressed="${lv === 'easy'}"><b>かんたん</b><small>2つから選ぶ</small></button>
          <button data-q="${q}" data-p="normal" aria-pressed="${lv === 'normal'}"><b>ふつう</b><small>3つから選ぶ</small></button>
          <button data-q="${q}" data-p="hard" aria-pressed="${lv === 'hard'}"><b>むずかしい</b><small>4つ・組合せ</small></button>
        </div>
        <p class="help">${lv === 'custom' ? '今はカスタム設定です。下の項目を個別に変えています。' : '下の項目で、さらに細かく変えられます。'}</p>
      </div>
      <div class="row"><span class="lbl">選択肢の数</span>${seg(q + '.choices', [[2, '2つ'], [3, '3つ'], [4, '4つ']])}</div>
      <div class="row"><span class="lbl">出す問題</span>${seg(q + '.quizType', [['color', 'いろだけ'], ['shape', 'かたちだけ'], ['mix', 'まぜこぜ']])}</div>
      ${sw(q + '.combo', '「あかい まる」のような組み合わせ問題も出す')}
      <p class="help">組み合わせ問題は「まぜこぜ」のときに出ます。</p>
      <div class="row">
        <span class="lbl">使う色（2つ以上）</span>
        <div class="seg">${COLORS.map(c => `<button class="chip" data-path="${q}.colors" data-v="${c.name}" aria-pressed="${Q.colors.includes(c.name)}"><i class="dot" style="background:${c.hex}"></i>${c.name}</button>`).join('')}</div>
      </div>
      <div class="row">
        <span class="lbl">使う形（2つ以上）</span>
        <div class="seg">${SHAPES.map(s => `<button class="chip" data-path="${q}.shapes" data-v="${s}" aria-pressed="${Q.shapes.includes(s)}">${shapeSVG(s, '#6B7488')}${s}</button>`).join('')}</div>
      </div>
      <div class="row"><span class="lbl">正解のあと、次の問題までの時間</span>${seg(q + '.wait', [['short', 'みじかい'], ['normal', 'ふつう'], ['long', 'ながい']])}</div>
    </section>`;
  }

  function settings() {
    pickVoice();
    if (!tab) tab = S.age === 3 ? '3' : '2';
    let body = '';
    if (tab === '2') body = `
      <section class="sec">
        <h3>どうぶつタッチ</h3>
        <div class="row"><span class="lbl">どうぶつの数</span>${seg('animalCount', [[6, '6ぴき（大きく表示）'], [12, '12ひき'], [16, '16ぴき（ぜんぶ）']])}</div>
        <div class="row"><span class="lbl">鳴き声</span>${seg('cryMode', [['real', '本物の鳴き声'], ['word', 'ことばで読む（ワンワン）'], ['off', 'なまえだけ']])}</div>
        <p class="help">「本物の鳴き声」は、なまえを読んだあとに録音した鳴き声が鳴ります。かげあてで正解したときも鳴ります。</p>
      </section>
      <section class="sec">
        <h3>シャボンだま</h3>
        <div class="row"><span class="lbl">あわの速さ</span>${seg('bubbleSpeed', [['slow', 'ゆっくり'], ['normal', 'ふつう'], ['fast', 'はやい']])}</div>
        ${sw('bubbleSay', 'わったとき、色の名前を読み上げる')}
      </section>
      ${quizSection(2)}`;
    if (tab === '3') body = `
      ${quizSection(3)}
      <section class="sec">
        <h3>かずあそび</h3>
        <div class="row"><span class="lbl">いくつまで数える？</span>${seg('countMax', [[3, '3まで'], [5, '5まで'], [10, '10まで']])}</div>
        <div class="row"><span class="lbl">こたえの数字の数</span>${seg('countChoices', [[2, '2つ'], [3, '3つ'], [4, '4つ']])}</div>
        <p class="help">まちがえると、いっしょに声に出して数え直します。</p>
      </section>
      <section class="sec">
        <h3>かげあて</h3>
        <div class="row"><span class="lbl">選択肢の数</span>${seg('shadowChoices', [[2, '2つ'], [3, '3つ'], [4, '4つ']])}</div>
      </section>`;
    if (tab === 'sound') body = `
      <section class="sec">
        <h3>音</h3>
        ${sw('voice', '読み上げの声')}
        <div class="row">
          <label class="lbl" for="voice-pick">声の種類</label>
          <div class="voice-row">
            <select id="voice-pick">
              <option value="">おすすめ（自動で選ぶ）</option>
              ${jaVoices.map(v => `<option value="${v.name.replace(/"/g, '&quot;')}" ${S.voiceName === v.name ? 'selected' : ''}>${v.name}</option>`).join('')}
            </select>
            <button class="try" id="voice-try">ためしに聞く</button>
          </div>
          <p class="help">今の声：${jaVoice ? jaVoice.name : '見つかりません'}。声の自然さはスマホに入っている音声で決まります。</p>
          ${/android/i.test(navigator.userAgent) ? `<p class="help"><b>Androidの場合</b>：声の種類はスマホ本体の設定で選びます。「設定」で「テキスト読み上げ」を検索 →「テキスト読み上げの出力」→ Google音声サービスの歯車 →「音声データをインストール」→「日本語（日本）」で好きな声を選び、アプリを開き直してください。</p>` : ''}
          <p class="help">もっと自然にするには、iPhoneは「設定」→「アクセシビリティ」→「読み上げコンテンツ」→「声」→「日本語」で「Kyoko（拡張）」や「O-ren（プレミアム）」などをダウンロードしてください。Androidは「Google音声サービス」の日本語音声を入れてください。入れたあと、ここで選べるようになります。</p>
        </div>
        <div class="row"><span class="lbl">声の速さ</span>${seg('rate', [['slow', 'ゆっくり'], ['normal', 'ふつう'], ['fast', 'はやい']])}</div>
        ${sw('sfx', '効果音（ピコン、など）')}
      </section>
      <p class="help">設定はこのスマホ（ブラウザ）に保存されます。</p>
      <button class="reset" id="reset">はじめの設定にもどす</button>`;

    app.innerHTML = `<div class="screen">${bar('おとなの設定')}
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="2" aria-selected="${tab === '2'}">2さい用</button>
        <button class="tab" role="tab" data-tab="3" aria-selected="${tab === '3'}">3さい用</button>
        <button class="tab" role="tab" data-tab="sound" aria-selected="${tab === 'sound'}">音・その他</button>
      </div>
      <div class="settings">${body}</div>
    </div>`;

    document.getElementById('back').onclick = () => { tab = null; go(home); };
    const rerender = () => { const sc = app.querySelector('.settings').scrollTop; settings(); app.querySelector('.settings').scrollTop = sc; };
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; sfx.pop(); settings(); });
    app.querySelectorAll('.preset button').forEach(b => b.onclick = () => {
      Object.assign(S[b.dataset.q], clone(PRESETS[b.dataset.p])); save(); sfx.pop(); rerender();
    });
    app.querySelectorAll('.seg[data-path] > button').forEach(b => b.onclick = () => {
      const path = b.parentElement.dataset.path;
      setP(path, b.dataset.num === 'true' ? +b.dataset.v : b.dataset.v);
      save(); sfx.pop(); rerender();
      if (path === 'rate') say('この速さで読みます');
    });
    app.querySelectorAll('.switch button').forEach(b => b.onclick = () => {
      setP(b.dataset.path, !getP(b.dataset.path)); save(); sfx.pop(); rerender();
    });
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const path = b.dataset.path, v = b.dataset.v, arr = getP(path);
      if (arr.includes(v)) { if (arr.length <= 2) return; setP(path, arr.filter(x => x !== v)); }
      else setP(path, arr.concat(v));
      save(); sfx.pop(); rerender();
    });
    const vp = document.getElementById('voice-pick');
    if (vp) vp.onchange = () => { S.voiceName = vp.value; save(); pickVoice(); rerender(); say('こんにちは。アカは、どれかな？'); };
    const vt = document.getElementById('voice-try');
    if (vt) vt.onclick = () => say('こんにちは。これはイヌです。アカは、どれかな？');
    const reset = document.getElementById('reset');
    if (reset) reset.onclick = () => { const age = S.age; S = clone(DEFAULTS); S.age = age; save(); sfx.pop(); rerender(); };
  }

  home();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
